name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Disposable database for the migrations and the database tests. Trust auth: the container
      # lives only for this job, so no password is kept in the repository.
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: devascent_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/devascent_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      # git status also sees new files, which git diff would miss.
      - name: Migrations match the schema
        run: |
          pnpm --filter @devascent/api db:generate
          test -z "$(git status --porcelain -- apps/api/drizzle)"
      - run: pnpm --filter @devascent/api db:migrate
      - run: pnpm --filter @devascent/api test:db
