# Local development database. Only the author starts it: docker compose up -d
# POSTGRES_PASSWORD comes from the root environment file (see the example file at the root).
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: devascent
      POSTGRES_USER: devascent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root environment file}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Since PostgreSQL 18 the image keeps its data under /var/lib/postgresql/<version>.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devascent -d devascent']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
